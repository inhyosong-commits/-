name: 종목 추가 (이슈로 요청)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add:
    # 저장소 주인이 연 "종목추가:" 이슈만 처리
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '종목추가')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 종목 찾아서 추가
        env:
          Q: ${{ github.event.issue.title }}
        run: node scripts/add-stock.js
      - name: 저장하고 결과 알리기
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if ! git diff --quiet config/; then
            git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
            git add config/extra-stocks.json && git commit -q -m "종목 추가: $(cat result.txt | head -c 80)" && git push -q
            gh workflow run update.yml --ref main
          fi
          gh issue comment "$NUM" --body-file result.txt
          gh issue close "$NUM"
