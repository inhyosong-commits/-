name: 시세 갱신 및 배포

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 (GitHub 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      force_report:
        description: 'AI 리포트를 지금 새로 쓰기'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 시세 받아오기
        run: node scripts/fetch-data.js public/market.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/market.json"
      - name: 뉴스 받아오기
        run: node scripts/fetch-news.js public/news.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json"
        continue-on-error: true
      - name: 외국인·기관 매매 동향 받아오기
        run: node scripts/fetch-flows.js public/flows.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/flows.json"
        continue-on-error: true
      - name: 실적·거시 일정 받아오기
        run: node scripts/fetch-events.js public/events.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/events.json"
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - name: AI 종합 리포트 (Perplexity, 키가 있을 때만)
        run: node scripts/ai-report.js public/market.json public/news.json public/report.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report.json"
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          FORCE_REPORT: ${{ inputs.force_report && '1' || '0' }}
          SNAPSHOT_OUT: snapshot.txt
      - name: 텔레그램 알림 (토큰이 있을 때만)
        run: node scripts/alerts.js public/market.json public/events.json alert-state.json
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: 숫자 요약·알림 기록을 data 브랜치에 저장
        continue-on-error: true
        run: |
          mkdir -p /tmp/snap
          [ -f snapshot.txt ] && cp snapshot.txt /tmp/snap/
          [ -f alert-state.json ] && cp alert-state.json /tmp/snap/
          cd /tmp/snap && [ -n "$(ls)" ] || exit 0
          git init -q -b data && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "snapshot"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 배포 재시도 (GitHub 일시 오류 대비)
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
